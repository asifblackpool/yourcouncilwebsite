name: Docker - Build and push latest

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  debug-secrets:
    name: Debug Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify BLOCK_ID
        run: |
          echo "=== BLOCK_ID VERIFICATION ==="
          echo "BLOCK_ID: ${{ secrets.BLOCK_ID }}"
          if [ -z "${{ secrets.BLOCK_ID }}" ]; then
            echo "❌ BLOCK_ID is empty!"
            exit 1
          else
            echo "✅ BLOCK_ID is set"
            if [ "${{ secrets.BLOCK_ID }}" = "your-council-website" ]; then
              echo "✅ BLOCK_ID is correct! (your-council-website)"
            else
              echo "⚠️  BLOCK_ID is: ${{ secrets.BLOCK_ID }}"
              echo "   Expected: your-council-website"
            fi
          fi

  build-latest:
    name: Build Block
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Check GH_PAT secret
        run: |
          echo "Checking if GH_PAT secret is available..."
          if [ -n "$GH_PAT" ]; then
            echo "✅ GH_PAT is set!"
            echo "Token length: ${#GH_PAT}"
          else
            echo "❌ GH_PAT is NOT set or is empty!"
            exit 1
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Stamp project version with build number
        run: |
          CSPROJ_FILE=$(find . -name "*.csproj" -not -path "./*Tests*" -not -path "./*test*" | head -1)
          echo "Found project file: $CSPROJ_FILE"
          sed -i 's|<Version>.*</Version>|<Version>1.0.${{ github.run_number }}</Version>|g' $CSPROJ_FILE
          echo "Updated version to:"
          grep -A 1 -B 1 '<Version>' $CSPROJ_FILE

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GH_PAT=${{ secrets.GH_PAT }} \
            --build-arg PROJECT_API_ID=${{ secrets.PROJECT_API_ID }} \
            --build-arg ALIAS=${{ secrets.ALIAS }} \
            --build-arg CONTENSIS_CLIENT_ID=${{ secrets.CONTENSIS_CLIENT_ID }} \
            --build-arg CONTENSIS_CLIENT_SECRET=${{ secrets.CONTENSIS_SHARED_SECRET }} \
            --build-arg ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }} \
            --build-arg BLOCK_ID=${{ secrets.BLOCK_ID }} \
            --build-arg TARGETARCH=amd64 \
            -t ${{ env.IMAGE_NAME }}:build-${{ github.run_number }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      # =============================================
      # FIXED: Debug - Verify .env file (completes in seconds!)
      # =============================================
      - name: Debug - Verify .env file in Docker image
        run: |
          echo "=== VERIFYING .env FILE IN DOCKER IMAGE ==="
          echo ""
          echo "1. Checking if .env exists..."
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:build-${{ github.run_number }} -c "ls -la .env && echo '✅ .env file found!' || echo '❌ .env file NOT found!'"
          echo ""
          echo "2. .env file contents (MASKED):"
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:build-${{ github.run_number }} -c "cat .env | sed 's/ACCESS_TOKEN=.*/ACCESS_TOKEN=***MASKED***/g' || echo '❌ Failed to read .env file!'"
          echo ""
          echo "3. Checking ACCESS_TOKEN environment variable (first 4 chars only):"
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:build-${{ github.run_number }} -c "echo ACCESS_TOKEN: \${ACCESS_TOKEN:0:4}..."
          echo ""
          echo "4. All environment variables (MASKED):"
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:build-${{ github.run_number }} -c "printenv | grep -E 'PROJECT_API_ID|ALIAS|CONTENSIS|ACCESS_TOKEN|BLOCK_ID' | sed 's/=.*/=***MASKED***/g' || echo 'No matching variables found'"
          echo "=== DEBUG COMPLETE ==="
        continue-on-error: true

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:build-${{ github.run_number }}
          docker push ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Push block to Contensis
    runs-on: ubuntu-latest
    needs: build-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Update Docker client
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          docker version --format '{{.Client.Version}}'
          
      - name: Push block to Contensis
        uses: contensis/block-push@v1
        env:
          DOCKER_API_VERSION: 1.44
        with:
          block-id: ${{ secrets.BLOCK_ID }}
          alias: ${{ secrets.ALIAS }}
          project-id: ${{ secrets.PROJECT_API_ID }}
          client-id: ${{ secrets.CONTENSIS_CLIENT_ID }}
          shared-secret: ${{ secrets.CONTENSIS_SHARED_SECRET }}
          image-uri: ${{ env.IMAGE_NAME }}:build-${{ github.run_number }}